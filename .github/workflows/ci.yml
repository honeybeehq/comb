name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Foundation key and acceptance client tests
        run: node --test scripts/foundation-bridge-key.test.mjs scripts/foundation-bridge-client.test.mjs
      - name: Fixture script syntax
        run: |
          node --check scripts/foundation-bridge-fixture.mjs
          node --check scripts/foundation-bridge-verify.mjs
          node --check scripts/foundation-bridge-acceptance.mjs
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install workspace Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy
      - name: Cache Rust dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-1.93.0-
      - name: Workspace tests
        run: cargo +1.93.0 test --locked --workspace --all-targets
      - name: Workspace lint
        run: cargo +1.93.0 clippy --locked --workspace --all-targets
