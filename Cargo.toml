[workspace]
resolver = "2"
members = ["crates/comb-core", "crates/comb-object", "crates/combctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "UNLICENSED"

[workspace.dependencies]
comb-core = { path = "crates/comb-core" }
comb-object = { path = "crates/comb-object" }
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
